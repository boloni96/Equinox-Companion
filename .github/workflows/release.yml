name: Publish Dalamud plugin

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: equinox-companion-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Read version and reject an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content src/EquinoxCompanion.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $tag = "v$version"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This version already exists. Bump Version for a new release.' }
          $global:LASTEXITCODE = 0
      - name: Download official Dalamud build references
        shell: pwsh
        run: |
          $refs = Join-Path $env:RUNNER_TEMP 'dalamud'
          $zip = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath $refs
          "DALAMUD_HOME=$refs" >> $env:GITHUB_ENV
      - name: Run transition tests
        run: dotnet run --project tests/GateTests.csproj -c Release
      - name: Build plugin
        run: dotnet build src/EquinoxCompanion.csproj -c Release -p:RestoreLockedMode=true
      - name: Package install ZIP and repository list
        shell: pwsh
        run: |
          python scripts/package_release.py --repository $env:GITHUB_REPOSITORY --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Upload draft, then publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG release/EquinoxCompanion.zip release/repo.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Equinox Companion $env:RELEASE_TAG (test build)" --notes-file RELEASE-NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed; nothing has been published' }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed; inspect the draft release' }
          "Install URL: https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/repo.json" >> $env:GITHUB_STEP_SUMMARY
