name: Build and verify Companion source
on:
  push:
    branches: [main, style/keybound-options-348, fix/keybound-question-347, feature/keybound-shopping-346, fix/keybound-background-345, fix/login-world-344, fix/activity-pulse-343, fix/keybound-clear-342, fix/keybound-resume-341, feature/keybound-recall-340, feature/keybound-339, fix/data-center-login-338, fix/automatic-service-account-337, perf/adventure-idle-336, fix/garden-materia-335, fix/visitor-inspection-334, feature/automatic-bed-discovery-333, feature/garden-main-tender-332, fix/garden-yard-walk-331, fix/garden-options-330, feature/manual-tend-all-329, fix/garden-idle-travel-328, fix/garden-supply-refresh-327, fix/garden-auto-batches-326, fix/garden-reassignment-325, fix/garden-door-fallback-324, fix/garden-arrival-323, fix/garden-forward-322, fix/garden-wall-321, fix/garden-plot-approach-320, feature/harvest-before-route-319, fix/care-target-318, fix/plant-confirmation-317, fix/plant-target-316, fix/house-plant-menu-315, fix/house-care-performance-314, fix/house-harvest-313, feature/garden-routes-312, fix/post-transfer-refresh-311, fix/armoury-withdrawal-310, fix/compact-transfer-notices-309, fix/complete-assignment-homes-308, feature/complete-organizer-ui-307, fix/visible-sale-prices-306, style/blue-button-borders-305, fix/independent-transfers-304, feature/assignment-check-303, feature/inventory-export-302, fix/organize-without-plan-301, fix/organizer-empty-preview-300, fix/trade-restart-all-299, feature/trader-selection-298, fix/item-trade-menu-297, feature/organizer-bulk-296, fix/plan-scope-295, feature/plan-categories-294, fix/organizer-resize-293, feature/item-trader-292, fix/retainer-capture-291, feature/trade-filter-290, feature/compact-organizer-289, feature/organizer-selection-288, fix/withdraw-known-stock-287, fix/crystal-storage-286, feature/crafting-withdraw-285, fix/compact-categories-284, fix/background-storage-283, fix/preview-search-282, fix/storage-refund-281, fix/organizer-space-280, fix/inventory-plans-279, fix/category-groups-278, fix/entrust-import-277, fix/organizer-planning-276, fix/organizer-toolbar-275, fix/retainer-menu-274, fix/organizer-all-273, fix/chest-toolbar-272, fix/outfit-quality-271, fix/retainer-tools-270, fix/retriever-stock-269, fix/retriever-planning-268, fix/workshop-turnins-267, fix/retrieval-intent-266, fix/retriever-lists-265, feature/retainer-retriever-264, fix/trade-clicks-263, fix/lottery-buyer-262, feature/all-inventory-trade-261, feature/ctrl-trade-260, fix/followthem-75, feature/equinox-helper-80, feature/equinox-helper-85]
    paths: ['src/**', 'tests/**', 'native-tests/**', 'market-tests/**', 'keybound-tests/**', 'scripts/publish_source.py', '.github/workflows/build-from-source.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: equinox-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download official build references
        shell: pwsh
        run: |
          $refs = Join-Path $env:RUNNER_TEMP 'dalamud'
          $zip = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile $zip
          Expand-Archive $zip -DestinationPath $refs
          "DALAMUD_HOME=$refs" >> $env:GITHUB_ENV
      - name: Run transition and regression tests
        run: dotnet run --project tests/GateTests.csproj -c Release
      - name: Verify native garden text decoding
        run: dotnet run --project native-tests/NativeTextTests.csproj -c Release
      - name: Verify market pricing and cancellation
        run: dotnet run --project market-tests/SellerTests.csproj -c Release
      - name: Verify optional Keybound input policy
        run: dotnet run --project keybound-tests/KeyboundTests.csproj -c Release
      - name: Build plugin
        run: dotnet build src/EquinoxCompanion.csproj -c Release -p:RestoreLockedMode=true
      - name: Package verified build
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/EquinoxCompanion.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Invalid version' }
          if (Test-Path "dist/v$version/EquinoxCompanion.zip") { throw 'Version already published' }
          python scripts/package_release.py --repository $env:GITHUB_REPOSITORY --tag "v$version" --ref main --output "dist/v$version"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          "PACKAGE_DIRECTORY=dist/v$version" >> $env:GITHUB_ENV
          Copy-Item "dist/v$version/repo.json" repo.json
          Get-FileHash "dist/v$version/EquinoxCompanion.zip" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: verified-companion
          path: |
            ${{ env.PACKAGE_DIRECTORY }}/
            repo.json
      - name: Publish package and feed atomically
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_source.py


